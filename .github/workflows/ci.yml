name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Shell syntax & diff integrity check (dogfooding)
        run: |
          bash -n init.sh template/.agents/update.sh template/scripts/*.sh template/.githooks/*
          git diff --check

      - name: Run starter unit and E2E tests
        run: node --test tests/starter.test.mjs template/scripts/spec-gates.test.mjs
